services:
  - type: web
    name: farma-consulta-backend
    runtime: docker
    dockerfilePath: ./farma-consulta-app/farma-consulta-app/backend/Dockerfile
    dockerContext: ./farma-consulta-app/farma-consulta-app/backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://farma-consulta-frontend-wxvx.onrender.com
      - key: APP_TIMEZONE
        value: America/Sao_Paulo
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: JAAS_APP_ID
        sync: false
      - key: JAAS_API_KEY_ID
        sync: false
      - key: JAAS_PRIVATE_KEY
        sync: false
  - type: web
    name: farma-consulta-frontend
    runtime: static
    rootDir: ./farma-consulta-app/farma-consulta-app/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://farma-consulta-backend-wxvx.onrender.com/api   # <-- corrigido, com /api
      - key: VITE_APP_TIMEZONE
        value: America/Sao_Paulo
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
